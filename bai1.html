<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài thơ Bốn Mùa</title>
    <style>
        body {
            font-family: 'Times New Roman', Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fffde7; /* Nền vàng nhạt */
            border: 2px solid #ffd54f; /* Viền HTML */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 100%;
        }
        h1 {
            color: red; /* Chữ đỏ */
            font-weight: bold; /* In đậm */
            background-color: #ffcdd2; /* Nền hồng */
            text-align: center; /* Căn giữa */
            padding: 12px;
            margin-top: 0;
            margin-bottom: 30px;
            border-radius: 8px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .stanza {
            font-style: italic; /* In nghiêng */
            text-align: center;
            line-height: 1.8;
            margin: 20px 0;
            font-size: 16px;
        }
        .stanza-1, .stanza-3 {
            color: blue; /* Khổ 1 và 3 màu xanh dương */
        }
        .stanza-2 {
            color: red; /* Khổ 2 màu đỏ */
        }
        hr {
            border: none;
            border-top: 1px solid #dcdcdc;
            margin: 25px auto;
            width: 60%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BỐN MÙA</h1>
    
    <div class="stanza stanza-1">
        Xuân về hoa nở khắp trời<br>
        Hạ sang nắng cháy rạng ngời phố quen<br>
        Thu về lá rụng bên thềm<br>
    </div>

    <hr>

      <div class="stanza stanza-2">
        Đông sang gió lạnh bên em đợi chờ <br>
        Bốn mùa là bốn giấc mơ<br>
        Thời gian đi mãi ta chờ đợi ai<br>

    </div>

    <hr>

      <div class="stanza stanza-3">
        Một năm rồi lại một năm <br>
        Vẫn còn câu hát thì thầm quê hương <br>
        Chờ xuân nắng mới gọi đường
    </div>
</div>

</body>
</html>
