
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Việt Nam</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 24px;
            margin: 0 0 8px;
        }

        header p {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        figure {
            margin: 0;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }

        figure img {
            display: block;
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        figcaption {
            padding: 8px 10px;
            font-size: 13px;
            color: #cbd5e1;
        }

        @media (max-width: 650px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 420px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            figure img {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Thư viện ảnh Việt Nam</h1>
        <p>Bộ sưu tập 6 danh thắng tiêu biểu — minh họa thẻ figure / figcaption.</p>
    </header>

    <main>
        <section class="gallery" aria-label="Danh sách ảnh danh thắng Việt Nam">
            <figure>
                <img src="Bai11/1-vinh-ha-long.jpg"
                     alt="Vịnh Hạ Long với biển và những hòn đảo">
                <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>

            <figure>
                <img src="Bai11/2-son-doong.jpg"
                     alt="Khung cảnh bên trong hang Sơn Đoòng">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>

            <figure>
                <img src="Bai11/3-thac-ban-gioc.jpg"
                     alt="Thác nước Bản Giốc giữa núi rừng">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>

            <figure>
                <img src="Bai11/4-fansipan.jpg"
                     alt="Núi Fansipan giữa mây trời">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>

            <figure>
                <img src="Bai11/5-mekong.jpg"
                     alt="Thuyền trên sông ở đồng bằng sông Cửu Long">
                <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <figure>
                <img src="Bai11/6-phong-nha.jpg"
                     alt="Thạch nhũ trong động Phong Nha">
                <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
